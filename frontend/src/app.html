<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <style>
      html {
        background: #0d0f12;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: #0d0f12;
        color: #eef1f4;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        background: #0d0f12;
        border-right: 1px solid #252c35;
      }

      .status-strip {
        min-height: 62px;
        background: #0d0f12;
        border-bottom: 1px solid #252c35;
      }

      .content-shell {
        width: min(100%, 1380px);
        margin: 0 auto;
        padding: 26px;
      }

      @media (max-width: 980px) {
        .app-shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
