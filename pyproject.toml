[project]
name = "upvote-monitor"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "cryptography>=49.0.0",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "redgifs>=2.4.0",
    "requests>=2.34.2",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.49.0",
    "yt-dlp>=2026.3.17",
]


[dependency-groups]
dev = [
    "ipykernel<7",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
]
